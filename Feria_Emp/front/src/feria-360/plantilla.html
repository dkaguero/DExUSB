<body>
<div id="fe-app">
  <div id="fe-barra">
    <span id="fe-titulo">Feria de Empleo USB</span>
    <div id="fe-pabellones" role="group" aria-label="Pabellones"></div>
    <button type="button" id="fe-abrir-directorio">Directorio</button>
    <button type="button" id="fe-pantalla" class="fe-pantalla">Pantalla completa</button>
  </div>
  <div id="fe-escena">
    <div id="fe-visor"></div>
    <div id="fe-cargando">Armando el pabellón…</div>
    <div id="fe-directorio" hidden>
      <button type="button" class="fe-dir-cerrar" aria-label="Cerrar el directorio">×</button>
      <div class="fe-dir-cuerpo"></div>
    </div>
    <div id="fe-ficha" hidden aria-live="polite"></div>
  </div>
</div>
